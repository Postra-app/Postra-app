services:
  postra:
    # Built from this checkout: no registry publishes the image.
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: postra-app:local
    container_name: postra
    restart: always
    environment:
      # === Required Settings
      MAIN_URL: 'http://localhost:4007'
      FRONTEND_URL: 'http://localhost:4007'
      NEXT_PUBLIC_BACKEND_URL: 'http://localhost:4007/api'
      JWT_SECRET: 'random string that is unique to every install - just type random characters here!'
      DATABASE_URL: 'postgresql://postra-user:postra-password@postra-postgres:5432/postra-db-local'
      REDIS_URL: 'redis://postra-redis:6379'
      BACKEND_INTERNAL_URL: 'http://localhost:3000'
      TEMPORAL_ADDRESS: "temporal:7233"
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'false'

      # === Storage Settings
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'

      # === Cloudflare (R2) Settings
      # STORAGE_PROVIDER: 'cloudflare'
      # CLOUDFLARE_ACCOUNT_ID: 'your-account-id'
      # CLOUDFLARE_ACCESS_KEY: 'your-access-key'
      # CLOUDFLARE_SECRET_ACCESS_KEY: 'your-secret-access-key'
      # CLOUDFLARE_BUCKETNAME: 'your-bucket-name'
      # CLOUDFLARE_BUCKET_URL: 'https://your-bucket-url.r2.cloudflarestorage.com/'
      # CLOUDFLARE_REGION: 'auto'

      # === Social Media API Settings
      X_URL: ''
      X_API_KEY: ''
      X_API_SECRET: ''
      LINKEDIN_CLIENT_ID: ''
      LINKEDIN_CLIENT_SECRET: ''
      LINKEDIN_PAGE_CLIENT_ID: ''
      LINKEDIN_PAGE_CLIENT_SECRET: ''
      REDDIT_CLIENT_ID: ''
      REDDIT_CLIENT_SECRET: ''
      GITHUB_CLIENT_ID: ''
      GITHUB_CLIENT_SECRET: ''
      BEEHIIVE_API_KEY: ''
      BEEHIIVE_PUBLICATION_ID: ''
      THREADS_APP_ID: ''
      THREADS_APP_SECRET: ''
      FACEBOOK_APP_ID: ''
      FACEBOOK_APP_SECRET: ''
      YOUTUBE_CLIENT_ID: ''
      YOUTUBE_CLIENT_SECRET: ''
      TIKTOK_CLIENT_ID: ''
      TIKTOK_CLIENT_SECRET: ''
      PINTEREST_CLIENT_ID: ''
      PINTEREST_CLIENT_SECRET: ''
      DRIBBBLE_CLIENT_ID: ''
      DRIBBBLE_CLIENT_SECRET: ''
      DISCORD_CLIENT_ID: ''
      DISCORD_CLIENT_SECRET: ''
      DISCORD_BOT_TOKEN_ID: ''
      SLACK_ID: ''
      SLACK_SECRET: ''
      SLACK_SIGNING_SECRET: ''
      MASTODON_URL: 'https://mastodon.social'
      MASTODON_CLIENT_ID: ''
      MASTODON_CLIENT_SECRET: ''

      # === OAuth & Authentik Settings
      # NEXT_PUBLIC_POSTRA_OAUTH_DISPLAY_NAME: 'Authentik'
      # NEXT_PUBLIC_POSTRA_OAUTH_LOGO_URL: 'https://raw.githubusercontent.com/walkxcode/dashboard-icons/master/png/authentik.png'
      # POSTRA_GENERIC_OAUTH: 'false'
      # POSTRA_OAUTH_URL: 'https://auth.example.com'
      # POSTRA_OAUTH_AUTH_URL: 'https://auth.example.com/application/o/authorize'
      # POSTRA_OAUTH_TOKEN_URL: 'https://auth.example.com/application/o/token'
      # POSTRA_OAUTH_USERINFO_URL: 'https://authentik.example.com/application/o/userinfo'
      # POSTRA_OAUTH_CLIENT_ID: ''
      # POSTRA_OAUTH_CLIENT_SECRET: ''
      # POSTRA_OAUTH_SCOPE: "openid profile email"  # Optional: uncomment to override default scope

      # === Sentry

      # NEXT_PUBLIC_SENTRY_DSN: 'http://spotlight:8969/stream'
      # SENTRY_SPOTLIGHT: '1'

      # === Misc Settings
      OPENAI_API_KEY: ''
      NEXT_PUBLIC_DISCORD_SUPPORT: ''
      NEXT_PUBLIC_POLOTNO: ''
      API_LIMIT: 30

      # === Payment / Stripe Settings
      FEE_AMOUNT: 0.05
      STRIPE_PUBLISHABLE_KEY: ''
      STRIPE_SECRET_KEY: ''
      STRIPE_SIGNING_KEY: ''
      STRIPE_SIGNING_KEY_CONNECT: ''

      # === Developer Settings
      NX_ADD_PLUGINS: false

      # === Short Link Service Settings (Optional - leave blank if unused)
      # DUB_TOKEN: ""
      # DUB_API_ENDPOINT: "https://api.dub.co"
      # DUB_SHORT_LINK_DOMAIN: "dub.sh"
      # SHORT_IO_SECRET_KEY: ""
      # KUTT_API_KEY: ""
      # KUTT_API_ENDPOINT: "https://kutt.it/api/v2"
      # KUTT_SHORT_LINK_DOMAIN: "kutt.it"
      # LINK_DRIP_API_KEY: ""
      # LINK_DRIP_API_ENDPOINT: "https://api.linkdrip.com/v1/"
      # LINK_DRIP_SHORT_LINK_DOMAIN: "dripl.ink"

    volumes:
      - postra-config:/config/
      - postra-uploads:/uploads/
    ports:
      - "4007:5000"
    networks:
      - postra-network
      - temporal-network
    depends_on:
      postra-postgres:
        condition: service_healthy
      postra-redis:
        condition: service_healthy

  postra-postgres:
    image: postgres:17-alpine
    container_name: postra-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postra-password
      POSTGRES_USER: postra-user
      POSTGRES_DB: postra-db-local
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - postra-network
    healthcheck:
      test: pg_isready -U postra-user -d postra-db-local
      interval: 10s
      timeout: 3s
      retries: 3
  postra-redis:
    image: redis:8.10.3-alpine
    container_name: postra-redis
    restart: always
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postra-redis-data:/data
    networks:
      - postra-network

  # For Application Monitoring / Debugging
  spotlight:
    container_name: spotlight
    ports:
      - 8969:8969/tcp
    image: ghcr.io/getsentry/spotlight:4.12.1
    networks:
      - postra-network

  # -----------------------
  # Temporal Stack
  # -----------------------
  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - 5432
    volumes:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 2s
      retries: 30

  # temporalio/server only runs the server, so the schema is created or
  # upgraded first with admin-tools of the same version. Each step leaves
  # an up-to-date database alone. Visibility stays in SQL, like production.
  temporal-schema:
    container_name: temporal-schema
    image: temporalio/admin-tools:1.32.1
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      - SQL_PLUGIN=postgres12
      - SQL_HOST=temporal-postgresql
      - SQL_PORT=5432
      - SQL_USER=temporal
      - SQL_PASSWORD=temporal
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for s in temporal:temporal temporal_visibility:visibility; do
          temporal-sql-tool --db "$${s%%:*}" create
          temporal-sql-tool --db "$${s%%:*}" setup-schema -v 0.0
          temporal-sql-tool --db "$${s%%:*}" update-schema -d "/etc/temporal/schema/postgresql/v12/$${s##*:}/versioned"
        done
    networks:
      - temporal-network

  temporal:
    container_name: temporal
    image: temporalio/server:1.32.1
    ports:
      - "7233:7233"
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    networks:
      - temporal-network
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 2s
      retries: 60
    labels:
      kompose.volume.type: configMap

  # The Temporal CLI; it registers the default namespace on start.
  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1.32.1
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until temporal operator cluster health >/dev/null 2>&1; do sleep 1; done
        temporal operator namespace describe -n default >/dev/null 2>&1 ||
          temporal operator namespace create -n default --retention 168h
        exec sleep infinity
    networks:
      - temporal-network
    depends_on:
      temporal:
        condition: service_healthy

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.57.0
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:3000
    networks:
      - temporal-network
    ports:
      - '8080:8080'

volumes:
  postgres-volume:
    external: false

  postra-redis-data:
    external: false

  postra-config:
    external: false

  postra-uploads:
    external: false

networks:
  postra-network:
    external: false
  temporal-network:
    driver: bridge
    name: temporal-network
