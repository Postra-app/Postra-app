# Local dev infrastructure
# Usage:
#   make infra          -- Postgres + Redis + Temporal + Temporal UI (default; the backend needs Temporal)
#   make infra-light    -- Postgres + Redis only (frontend-only work)
#   make infra-full     -- infra + pgAdmin + RedisInsight
#   make infra-stop     -- stop everything

services:
  # ── Core (always started) ──────────────────────────────────────
  postra-postgres:
    image: postgres:17-alpine
    container_name: postra-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postra-local-pwd
      POSTGRES_USER: postra-local
      POSTGRES_DB: postra-db-local
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: pg_isready -U postra-local -d postra-db-local
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - postra-network

  postra-redis:
    image: redis:7-alpine
    container_name: postra-redis
    restart: always
    ports:
      - 6379:6379
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - postra-network

  # ── Tools (profile: tools) ────────────────────────────────────
  postra-pg-admin:
    image: dpage/pgadmin4:9.18.0
    container_name: postra-pg-admin
    restart: always
    profiles: [tools]
    ports:
      - 8081:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - postra-network

  postra-redisinsight:
    image: redis/redisinsight:3.8.0
    container_name: postra-redisinsight
    restart: always
    profiles: [tools]
    links:
      - postra-redis
    ports:
      - 5540:5540
    volumes:
      - redisinsight:/data
    networks:
      - postra-network

  # ── Temporal (profile: temporal) ──────────────────────────────
  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    profiles: [temporal]
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - 5432
    volumes:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 2s
      retries: 30

  # temporalio/server only runs the server, so the schema is created or
  # upgraded first with admin-tools of the same version. Each step leaves
  # an up-to-date database alone. Visibility stays in SQL, like production.
  temporal-schema:
    container_name: temporal-schema
    image: temporalio/admin-tools:1.32.1
    profiles: [temporal]
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      - SQL_PLUGIN=postgres12
      - SQL_HOST=temporal-postgresql
      - SQL_PORT=5432
      - SQL_USER=temporal
      - SQL_PASSWORD=temporal
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for s in temporal:temporal temporal_visibility:visibility; do
          temporal-sql-tool --db "$${s%%:*}" create
          temporal-sql-tool --db "$${s%%:*}" setup-schema -v 0.0
          temporal-sql-tool --db "$${s%%:*}" update-schema -d "/etc/temporal/schema/postgresql/v12/$${s##*:}/versioned"
        done
    networks:
      - temporal-network

  temporal:
    container_name: temporal
    image: temporalio/server:1.32.1
    profiles: [temporal]
    ports:
      - "7233:7233"
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    networks:
      - temporal-network
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 2s
      retries: 60
    labels:
      kompose.volume.type: configMap

  # The Temporal CLI; it registers the default namespace on start.
  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1.32.1
    profiles: [temporal]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until temporal operator cluster health >/dev/null 2>&1; do sleep 1; done
        temporal operator namespace describe -n default >/dev/null 2>&1 ||
          temporal operator namespace create -n default --retention 168h
        exec sleep infinity
    networks:
      - temporal-network
    depends_on:
      temporal:
        condition: service_healthy

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.57.0
    profiles: [temporal]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:3000
    networks:
      - temporal-network
    ports:
      - "8080:8080"

volumes:
  redisinsight:
  postgres-volume:
    external: false

networks:
  postra-network:
    external: false
  temporal-network:
    driver: bridge
    name: temporal-network
