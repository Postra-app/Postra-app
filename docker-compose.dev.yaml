# Local dev infrastructure
# Usage:
#   make infra          -- Postgres + Redis only (light, default)
#   make infra-full     -- Postgres + Redis + Temporal + pgAdmin + RedisInsight
#   make infra-stop     -- stop everything

services:
  # ── Core (always started) ──────────────────────────────────────
  postra-postgres:
    image: postgres:17-alpine
    container_name: postra-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postra-local-pwd
      POSTGRES_USER: postra-local
      POSTGRES_DB: postra-db-local
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: pg_isready -U postra-local -d postra-db-local
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - postra-network

  postra-redis:
    image: redis:7-alpine
    container_name: postra-redis
    restart: always
    ports:
      - 6379:6379
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - postra-network

  # ── Tools (profile: tools) ────────────────────────────────────
  postra-pg-admin:
    image: dpage/pgadmin4:latest
    container_name: postra-pg-admin
    restart: always
    profiles: [tools]
    ports:
      - 8081:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - postra-network

  postra-redisinsight:
    image: redis/redisinsight:latest
    container_name: postra-redisinsight
    restart: always
    profiles: [tools]
    links:
      - postra-redis
    ports:
      - 5540:5540
    volumes:
      - redisinsight:/data
    networks:
      - postra-network

  # ── Temporal (profile: temporal) ──────────────────────────────
  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    profiles: [temporal]
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    expose:
      - 9200
    volumes:
      - /var/lib/elasticsearch/data

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    profiles: [temporal]
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - 5432
    volumes:
      - /var/lib/postgresql/data

  temporal:
    container_name: temporal
    image: temporalio/auto-setup:1.28.1
    profiles: [temporal]
    ports:
      - "7233:7233"
    depends_on:
      - temporal-postgresql
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      # Production runs Temporal with Elasticsearch off and visibility in SQL.
      # Local used to force it on, which meant a heavyweight container nobody
      # needed and a configuration that did not match the one being debugged.
      - ENABLE_ES=false
      - SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES=true
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap

  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    profiles: [temporal]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - temporal-network
    stdin_open: true
    depends_on:
      - temporal
    tty: true

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.34.0
    profiles: [temporal]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:3000
    networks:
      - temporal-network
    ports:
      - "8080:8080"

volumes:
  redisinsight:
  postgres-volume:
    external: false

networks:
  postra-network:
    external: false
  temporal-network:
    driver: bridge
    name: temporal-network
