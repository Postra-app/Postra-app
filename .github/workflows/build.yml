---
name: Build

on:
  push:
  merge_group:
  pull_request:

jobs:
  build:
    # Node from volta.node and pnpm from packageManager (package.json): one
    # source each. The name is the required check on main.
    name: build-app
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js from package.json
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          # pnpm is installed in the next step; v5 would cache it before it exists.
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.STORE_PATH }}
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
