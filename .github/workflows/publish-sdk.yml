name: Publish SDK

# Publishes apps/sdk as @postra/node through npm trusted publishing: npm
# trusts this workflow file over OIDC, so there is no npm token anywhere.
# The very first version was published by hand (npm only lets you attach a
# trusted publisher to a package that already exists). After that: bump
# "version" in apps/sdk/package.json, merge, push a tag `sdk-v<version>`.

on:
  push:
    tags:
      - 'sdk-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js (volta.node)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          # No registry-url: it writes an .npmrc whose _authToken is
          # ${NODE_AUTH_TOKEN}, and there is no token here, only OIDC.

      - name: Tag matches the package version
        working-directory: apps/sdk
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "sdk-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/sdk version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm exec jest apps/sdk --forceExit

      # npm logs a failed OIDC exchange only at "verbose": the 2026-10-08
      # publish of 1.1.0 ended in a bare E404 with no reason.
      - name: Publish
        working-directory: apps/sdk
        run: npm publish --access public --loglevel verbose
