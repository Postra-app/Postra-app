name: Deploy

on:
  push:
    branches:
      - main

# id-token: GitHub's OIDC token is exchanged for the deploy role of the
# postra account (Postra-infra, AWS_DEPLOY_ROLE_ARN) — no AWS keys are stored
# in this public repo's secrets.
permissions:
  contents: read
  id-token: write

# Merging several PRs back-to-back used to queue one full ~12-min deploy per
# merge. Each deploy ships whatever is on main at that moment, so an older
# queued/running deploy is always superseded by a newer one — cancel it and
# run only the latest. Cancellation almost always lands during the multi-minute
# build/push phase (merges arrive seconds apart). A cancel during the group
# refresh leaves APP_IMAGE on the newer image; the superseding deploy writes its
# own and refreshes again, and the rollback reads APP_IMAGE_VERIFIED, never the
# image a cancelled deploy left behind.
concurrency:
  group: deploy
  cancel-in-progress: true

# Production is the auto scaling group of the postra account (Postra-infra
# modules/app_asg) since the move of 2026-10-25 (runbook A5); the box on the
# shared account and its SSM deploy are gone. Repository variables:
#   SSM_PREFIX     parameters the instances build .env from; APP_IMAGE and
#                  APP_IMAGE_VERIFIED live under it
#   ASG_NAME       the group to refresh
# AWS_DEPLOY_ROLE_ARN, AWS_REGION and ECR_REGISTRY (the registry host) are
# secrets of the account deployed to.
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY: postra-app
  IMAGE_TAG_SHA: sha-${{ github.sha }}
  SSM_PREFIX: ${{ vars.SSM_PREFIX || '/postra/prod' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: postra-deploy-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URIs
        id: image
        run: |
          echo "image_latest=${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" >> "$GITHUB_OUTPUT"
          echo "image_sha=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG_SHA}" >> "$GITHUB_OUTPUT"

      # The same commit deployed again (a re-run after a failed smoke, the
      # first deploy through a new account's pipeline with the image copied
      # over) does not need the ten-minute build: the tag is immutable, so an
      # image with it is this commit. A registry that cannot answer (the role
      # lacks ecr:DescribeImages) builds as before.
      - name: Look for the image in ECR
        id: existing
        run: |
          if aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids "imageTag=${IMAGE_TAG_SHA}" --query 'imageDetails[0].imageDigest' --output text >/dev/null 2>&1; then
            echo "Image ${IMAGE_TAG_SHA} is in ${ECR_REGISTRY} already - build skipped"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        if: steps.existing.outputs.exists != 'true'
        run: |
          docker build \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=${GITHUB_SHA} \
            --build-arg SENTRY_ORG="${{ secrets.SENTRY_ORG }}" \
            --build-arg SENTRY_PROJECT="${{ secrets.SENTRY_PROJECT }}" \
            --build-arg SENTRY_AUTH_TOKEN="${{ secrets.SENTRY_AUTH_TOKEN }}" \
            -t "${{ steps.image.outputs.image_latest }}" \
            -t "${{ steps.image.outputs.image_sha }}" \
            .

      - name: Push Docker image
        if: steps.existing.outputs.exists != 'true'
        run: |
          docker push "${{ steps.image.outputs.image_latest }}"
          docker push "${{ steps.image.outputs.image_sha }}"

  # Staging (Plan/lunchdayfinal.md P7): the same image on staging.postra.pl,
  # started for this deploy and stopped after it, health + smoke there before
  # production gets it. Off until the repo variable STAGING_ENABLED is "true"
  # (staging is applied ~a week before D2, decision K. 2026-10-03).
  staging:
    needs: build
    if: vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: postra-deploy-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set image URIs
        id: image
        run: |
          echo "image_latest=${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" >> "$GITHUB_OUTPUT"
          echo "image_sha=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG_SHA}" >> "$GITHUB_OUTPUT"

      - name: Deploy, check and stop staging
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_sha }}
          E2E_EMAIL: ${{ secrets.STAGING_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
        run: .github/scripts/deploy-staging.sh

      - name: Upload staging smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-staging
          path: e2e/playwright/.results/
          retention-days: 7
          include-hidden-files: true

  # The postra account runs the app in an auto scaling group (Postra-infra
  # modules/app_asg, "step 0" of resilience): a deploy writes the image name
  # to SSM and refreshes the group, so a fresh instance boots with the new
  # image and the old one goes once the new one is healthy behind the load
  # balancer. No SSH, no SSM shell on the box, nothing to patch in place.
  # Skipped staging (STAGING_ENABLED off) lets production deploy; a failed
  # staging stops it. The rollback puts the last verified image name back and
  # refreshes again, since the refresh cannot undo an SSM change.
  deploy:
    needs: [build, staging]
    if: always() && needs.build.result == 'success' && (needs.staging.result == 'success' || needs.staging.result == 'skipped')
    environment: production
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    env:
      ASG_NAME: ${{ vars.ASG_NAME }}
      APP_URL: https://app.postra.co.uk
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: postra-deploy-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set image URIs
        id: image
        run: |
          echo "image_sha=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG_SHA}" >> "$GITHUB_OUTPUT"

      # APP_IMAGE is what the group boots; APP_IMAGE_VERIFIED is the last
      # image that passed the health check and the smoke, written at the end
      # of this job. The rollback goes to the verified one, not to whatever
      # APP_IMAGE held: a deploy cancelled by the next one (cancel-in-progress)
      # leaves its unchecked image in APP_IMAGE (Codex).
      - name: Point the group at the new image
        id: param
        run: |
          test -n "${ASG_NAME}" || { echo "ASG_NAME is not set"; exit 1; }
          VERIFIED=$(aws ssm get-parameter --name "${SSM_PREFIX}/APP_IMAGE_VERIFIED" --query Parameter.Value --output text 2>/dev/null || true)
          if [ -z "$VERIFIED" ] || [ "$VERIFIED" = "None" ]; then
            VERIFIED=$(aws ssm get-parameter --name "${SSM_PREFIX}/APP_IMAGE" --query Parameter.Value --output text)
            echo "No verified image recorded yet - the rollback target is the current APP_IMAGE"
          fi
          echo "Rollback target: ${VERIFIED}"
          echo "previous=${VERIFIED}" >> "$GITHUB_OUTPUT"
          aws ssm put-parameter --name "${SSM_PREFIX}/APP_IMAGE" --type String --value "${{ steps.image.outputs.image_sha }}" --overwrite >/dev/null
          echo "APP_IMAGE = ${{ steps.image.outputs.image_sha }}"

      - name: Refresh the group
        id: refresh
        run: .github/scripts/asg-refresh.sh "${ASG_NAME}"

      - name: Health check
        id: health
        run: |
          for attempt in $(seq 1 60); do
            STATUS=$(curl -s -o /tmp/postra-health.txt -w "%{http_code}" "${APP_URL}/api/monitor/queue/main" || true)
            if [ "$STATUS" = "200" ]; then
              cat /tmp/postra-health.txt
              exit 0
            fi
            echo "Health check attempt ${attempt} failed with status: ${STATUS}"
            sleep 10
          done
          echo "Health check failed after 10 min"
          exit 1

      - name: Wait for the app to settle
        run: |
          ok=0
          for attempt in $(seq 1 60); do
            API=$(curl -s -o /dev/null -w "%{http_code}" "${APP_URL}/api/monitor/queue/main" || true)
            WEB=$(curl -s -o /dev/null -w "%{http_code}" "${APP_URL}/auth/login" || true)
            if [ "$API" = "200" ] && [ "$WEB" = "200" ]; then
              ok=$((ok + 1))
              if [ "$ok" -ge 5 ]; then
                echo "Settled after $attempt checks"
                exit 0
              fi
            else
              echo "Check $attempt: api=$API web=$WEB - starting the count again"
              ok=0
            fi
            sleep 3
          done
          echo "::warning::The app did not answer 5 times in a row within 3 minutes - running the smoke anyway"

      - name: Smoke test (Playwright)
        id: smoke
        env:
          E2E_BASE_URL: https://app.postra.co.uk
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_ORG: ${{ secrets.E2E_ORG }}
        run: |
          if [ -z "$E2E_EMAIL" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "::warning::E2E_EMAIL / E2E_PASSWORD not set - smoke test skipped"
            exit 0
          fi
          npm install --prefix e2e/playwright --no-save --no-package-lock "@playwright/test@$(jq -r '.devDependencies["@playwright/test"]' package.json)"
          e2e/playwright/node_modules/.bin/playwright install --with-deps chromium
          e2e/playwright/node_modules/.bin/playwright test -c e2e/playwright --project smoke

      - name: Record the image as verified
        run: |
          aws ssm put-parameter --name "${SSM_PREFIX}/APP_IMAGE_VERIFIED" --type String --value "${{ steps.image.outputs.image_sha }}" --overwrite >/dev/null
          echo "APP_IMAGE_VERIFIED = ${{ steps.image.outputs.image_sha }}"

      - name: Upload smoke test screenshots
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke
          path: e2e/playwright/.results/
          retention-days: 7
          include-hidden-files: true

      # Anything after the parameter was written: refresh failed or timed
      # out, the app never turned healthy, or the smoke failed. The last
      # verified image goes back into APP_IMAGE and the group rolls once more. The job still
      # fails - the new version did not ship. Migrations the new image ran
      # stay applied (additive only).
      - name: Roll back to the previous image
        if: failure() && steps.param.outcome == 'success'
        run: |
          PREVIOUS="${{ steps.param.outputs.previous }}"
          if [ -z "$PREVIOUS" ] || [ "$PREVIOUS" = "None" ]; then
            echo "No previous image recorded - the group keeps the new image"
            exit 1
          fi
          echo "Rolling back to ${PREVIOUS}"
          aws ssm put-parameter --name "${SSM_PREFIX}/APP_IMAGE" --type String --value "${PREVIOUS}" --overwrite >/dev/null
          .github/scripts/asg-refresh.sh "${ASG_NAME}"
          for attempt in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${APP_URL}/api/monitor/queue/main" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Rolled back: the previous version is healthy. This deploy did not ship."
              exit 1
            fi
            echo "Post-rollback health attempt ${attempt}: ${STATUS}"
            sleep 10
          done
          echo "Rolled back, but the previous version is not healthy either"
          exit 1

