name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js (volta.node)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Test
        timeout-minutes: 5
        run: pnpm test --passWithNoTests

  # Lint and type-check gate. `pnpm build` is not a type gate (Next skips files
  # no route imports, Nest never compiles specs), and lint never ran in CI
  # before this job.
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js (volta.node)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint --quiet

      - name: Type-check
        run: pnpm typecheck

  # The whole app on throwaway Postgres, Redis and Temporal (e2e/stack):
  # API contracts and organisation isolation over HTTP, publishing end to end
  # through the real Mastodon provider to a fake instance, and the composer in
  # Chromium. Catches what unit tests mock away and what production may never
  # be used for (publishing, destructive cases).
  stack-e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js (volta.node)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend, orchestrator and frontend
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Install Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit

      # The app image has ffmpeg (poster frames, captions); the runner does not.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      # Every port the stack listens on sits in Linux's ephemeral range
      # (32768-60999), so a stray outbound connection of the runner can take
      # one first: once the backend died with EADDRINUSE on 53000 and the
      # job waited 120 s for nothing. Reserved ports are never handed out as
      # ephemeral; the list is checked against the stack config by
      # libraries/helpers/src/repo/ci-workflows.spec.ts.
      - name: Reserve the stack's ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=9464,53000,54000,54200,55432,56379,57233,58080,58090

      - name: Stack tests (API + UI)
        run: pnpm e2e:stack:ui

      # Only local fakes in here: stack.env values, example.com users.
      - name: Upload logs and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-e2e
          path: |
            e2e/stack/.logs/
            e2e/stack/.results/
          retention-days: 7
          # The result folders start with a dot, which upload-artifact skips
          # unless told otherwise.
          include-hidden-files: true

  # Boot applies migration files (prisma migrate deploy), so the schema is only
  # real once a migration carries it. `db push` used to reconcile the difference
  # silently; nothing does now, and a schema change without a migration would
  # ship code expecting columns the database does not have. Fail the PR instead.
  schema-migrations-match:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js (volta.node)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Migrations reproduce schema.prisma
        run: |
          # No install in this job: dlx, at the version package.json pins.
          # pnpm 10.34 skips build scripts in dlx too; without the engines'
          # postinstall Prisma fetches them mid-command (ECONNRESET).
          pnpm dlx --allow-build=@prisma/engines "prisma@$(jq -r '.devDependencies.prisma' package.json)" migrate diff \
            --from-migrations ./libraries/nestjs-libraries/src/database/prisma/migrations \
            --to-schema-datamodel ./libraries/nestjs-libraries/src/database/prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/shadow \
            --exit-code

