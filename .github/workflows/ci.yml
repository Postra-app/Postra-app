name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.1
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Test
        timeout-minutes: 5
        run: pnpm test --passWithNoTests

  # Lint and type-check gate. `pnpm build` is not a type gate (Next skips files
  # no route imports, Nest never compiles specs), and lint never ran in CI
  # before this job (E2E-01-06).
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.1
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint --quiet

      - name: Type-check
        run: pnpm typecheck

  # The whole app on throwaway Postgres, Redis and Temporal (e2e/stack):
  # API contracts and organisation isolation over HTTP, publishing end to end
  # through the real Mastodon provider to a fake instance, and the composer in
  # Chromium. Catches what unit tests mock away and what production may never
  # be used for (publishing, destructive cases).
  stack-e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.1
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend, orchestrator and frontend
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Stack tests (API + UI)
        run: pnpm e2e:stack:ui

      # Only local fakes in here: stack.env values, example.com users.
      - name: Upload logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stack-e2e
          path: |
            e2e/stack/.logs/
            e2e/stack/.results/
          retention-days: 7
          # The result folders start with a dot, which upload-artifact skips
          # unless told otherwise.
          include-hidden-files: true

  # Boot applies migration files (prisma migrate deploy), so the schema is only
  # real once a migration carries it. `db push` used to reconcile the difference
  # silently; nothing does now, and a schema change without a migration would
  # ship code expecting columns the database does not have. Fail the PR instead.
  schema-migrations-match:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.1
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Migrations reproduce schema.prisma
        run: |
          pnpm dlx prisma@6.5.0 migrate diff \
            --from-migrations ./libraries/nestjs-libraries/src/database/prisma/migrations \
            --to-schema-datamodel ./libraries/nestjs-libraries/src/database/prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/shadow \
            --exit-code

