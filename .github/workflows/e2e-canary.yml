name: E2E canary

# Every night against production: the post-deploy smoke on Chromium and on
# desktop Safari (WebKit), AI on the real OpenAI key, real publishing on the
# technical channels, and the UK landing.
# Things break between deploys too — an expired key, a provider change, a
# landing re-upload — and nobody deploys at night to notice. A failure opens (or comments on) an issue
# labelled `canary`, which GitHub mails out.

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: e2e-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # npm only installs the test runner here; no pnpm cache.
          package-manager-cache: false

      # Only the test runner, not the whole monorepo — same as the deploy
      # smoke, at the version the root devDependency pins.
      - name: Install Playwright
        run: |
          npm install --prefix e2e/playwright --no-save --no-package-lock "@playwright/test@$(jq -r '.devDependencies["@playwright/test"]' package.json)"
          e2e/playwright/node_modules/.bin/playwright install --with-deps chromium webkit

      # The smoke only drafts; publish-canary publishes for real, on the
      # technical channels only. One sign-in for everything (the login limit
      # is 5 per 15 minutes per IP).
      - name: Smoke (Chromium + WebKit), AI, publishing and landing
        id: canary
        env:
          E2E_BASE_URL: https://app.postra.pl
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_ORG: ${{ secrets.E2E_ORG }}
        run: |
          if [ -z "$E2E_EMAIL" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "::warning::E2E_EMAIL / E2E_PASSWORD not set — landing only"
            e2e/playwright/node_modules/.bin/playwright test -c e2e/playwright --project landing
            exit $?
          fi
          e2e/playwright/node_modules/.bin/playwright test -c e2e/playwright \
            --project smoke --project smoke-webkit --project ai-canary --project publish-canary --project landing

      # Screenshots only: traces are off in CI (they carry the session cookie).
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-canary
          path: e2e/playwright/.results/
          retention-days: 7
          # The result folders start with a dot, which upload-artifact skips
          # unless told otherwise.
          include-hidden-files: true

      - name: Open or update the canary issue
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const day = new Date().toISOString().slice(0, 10);
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'canary', per_page: 1,
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open.data[0].number,
                body: `Failed again on ${day}: ${run}`,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: `E2E canary failed on ${day}`,
                labels: ['canary'],
                body: `The nightly production canary failed: ${run}\n\nScreenshots are in the run's artifacts. Close this issue once the cause is fixed.`,
              });
            }
