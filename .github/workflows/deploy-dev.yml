name: Deploy Dev

on:
  push:
    branches:
      - main

# id-token: GitHub's OIDC token is exchanged for the AWS role
# postra-github-deploy (terraform envs/dev/github_deploy.tf) — no AWS keys
# are stored in this public repo's secrets.
permissions:
  contents: read
  id-token: write

# Merging several PRs back-to-back used to queue one full ~12-min deploy per
# merge. Each deploy ships whatever is on main at that moment, so an older
# queued/running deploy is always superseded by a newer one — cancel it and
# run only the latest. Cancellation almost always lands during the multi-minute
# build/push phase (merges arrive seconds apart), i.e. before the SSM step, so
# there's no half-applied box. Caveat: the SSM RunShellScript is detached — if a
# cancel ever lands *during* the SSM step, that command keeps running on the
# box; the superseding deploy's `docker compose up --force-recreate` is
# idempotent and wins, so worst case is a brief overlap, not a broken deploy.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY: postra-app
  IMAGE_TAG_SHA: sha-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: postra-deploy-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URIs
        id: image
        run: |
          echo "image_latest=${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" >> "$GITHUB_OUTPUT"
          echo "image_sha=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=${GITHUB_SHA} \
            --build-arg SENTRY_ORG="${{ secrets.SENTRY_ORG }}" \
            --build-arg SENTRY_PROJECT="${{ secrets.SENTRY_PROJECT }}" \
            --build-arg SENTRY_AUTH_TOKEN="${{ secrets.SENTRY_AUTH_TOKEN }}" \
            -t "${{ steps.image.outputs.image_latest }}" \
            -t "${{ steps.image.outputs.image_sha }}" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ steps.image.outputs.image_latest }}"
          docker push "${{ steps.image.outputs.image_sha }}"

  # Staging (Plan/lunchdayfinal.md P7): the same image on staging.postra.pl,
  # started for this deploy and stopped after it, health + smoke there before
  # production gets it. Off until the repo variable STAGING_ENABLED is "true"
  # (staging is applied ~a week before D2, decision K. 2026-10-03).
  staging:
    needs: build
    if: vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: postra-deploy-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set image URIs
        id: image
        run: |
          echo "image_latest=${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" >> "$GITHUB_OUTPUT"
          echo "image_sha=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG_SHA}" >> "$GITHUB_OUTPUT"

      - name: Deploy, check and stop staging
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_sha }}
          E2E_EMAIL: ${{ secrets.STAGING_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
        run: .github/scripts/deploy-staging.sh

      - name: Upload staging smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-staging
          path: e2e/playwright/.results/
          retention-days: 7
          include-hidden-files: true

  deploy:
    needs: [build, staging]
    # Skipped staging (STAGING_ENABLED off) lets production deploy as before;
    # a failed staging stops it.
    if: always() && needs.build.result == 'success' && (needs.staging.result == 'success' || needs.staging.result == 'skipped')
    # Approval, if any, is set on this environment in the repo settings.
    environment: production
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: postra-deploy-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve EC2 instance by tag
        id: resolve
        run: |
          # Resolve the live instance by its Name tag instead of a fixed
          # EC2_INSTANCE_ID secret. A fixed ID broke the deploy with
          # "InvalidInstanceId" after Terraform replaced the box. A userdata
          # change is now a stop/start that keeps the ID
          # (user_data_replace_on_change = false in Postra-infra), but a
          # replacement (new AMI, rebuild) still changes it. Looking it up by
          # tag each run makes the deploy immune to replacement.
          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "${AWS_REGION}" \
            --filters "Name=tag:Name,Values=postra-dev-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text | awk '{print $1}')
          # Defensive fallback to the secret if the tag lookup finds nothing.
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
            echo "Tag lookup empty — falling back to EC2_INSTANCE_ID secret"
          fi
          if [ -z "$INSTANCE_ID" ]; then
            echo "No running postra-dev-app instance and no secret fallback"; exit 1
          fi
          echo "Resolved instance: ${INSTANCE_ID}"
          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"

      - name: Set image URIs
        id: image
        run: |
          echo "image_latest=${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" >> "$GITHUB_OUTPUT"
          echo "image_sha=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG_SHA}" >> "$GITHUB_OUTPUT"

      - name: Deploy on EC2 via SSM
        id: ssm
        run: |
          IMAGE_URI="${{ steps.image.outputs.image_sha }}"
          # .env is built from SSM only at instance boot, so rotated params
          # (e.g. SMTP creds) never reached the app — rebuild it on every
          # deploy. --force-recreate because a restarted container keeps its
          # old env_file values; only recreation reloads them (2026-06-10).
          COMMANDS_JSON=$(jq -nc --arg region "${AWS_REGION}" --arg registry "${ECR_REGISTRY}" --arg image "${IMAGE_URI}" '{
            commands: [
              "set -e",
              "cd /opt/postra",
              "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
              "docker image prune -af || true",
              "docker pull \($image)",
              "aws ssm get-parameters-by-path --path /postra/dev/ --with-decryption --recursive --region \($region) --query \"Parameters[*].[Name,Value]\" --output text | while read -r n v; do echo \"${n#/postra/dev/}=$v\"; done > .env.new",
              "test -s .env.new && mv .env.new .env",
              "PREV=$(awk \"/image:/ {print \\$2; exit}\" docker-compose.override.yml 2>/dev/null || true); if [ -n \"$PREV\" ] && [ \"$PREV\" != \"\($image)\" ]; then echo \"$PREV\" > .previous-image; fi",
              "cat > docker-compose.override.yml <<EOF\nservices:\n  app:\n    image: \($image)\nEOF",
              "mkdir -p /var/lib/postra-watchdog && date +%s > /var/lib/postra-watchdog/last-action && echo deploy > /var/lib/postra-watchdog/last-action.by",
              "docker compose up -d --force-recreate app",
              "sleep 3 && docker exec -u root postra-app chown -R www:www /uploads || true",
              "PREV=$(cat .previous-image 2>/dev/null || true); if [ -n \"$PREV\" ] && [ \"$PREV\" != \"\($image)\" ]; then docker rm postra-app-previous >/dev/null 2>&1 || true; docker create --name postra-app-previous \"$PREV\" >/dev/null || true; fi",
              "docker image prune -af || true"
            ]
          }')
          COMMAND_ID=$(
            aws ssm send-command \
              --instance-ids "${{ steps.resolve.outputs.instance_id }}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy ${GITHUB_SHA} to app-dev.postra.pl" \
              --parameters "${COMMANDS_JSON}" \
              --query "Command.CommandId" \
              --output text
          )

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

      # continue-on-error: a timeout here must not kill the job — the command
      # can still be running fine (slow docker pull on a loaded box) and the
      # steps that follow are the recovery path. 2026-07-14: the command
      # finished OK at ~12 min, but the workflow had already bailed at 10 and
      # skipped the health check + pm2 auto-restart exactly when the box hung.
      - name: Wait for SSM command
        id: wait
        continue-on-error: true
        run: |
          COMMAND_ID="${{ steps.ssm.outputs.command_id }}"
          INSTANCE_ID="${{ steps.resolve.outputs.instance_id }}"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Attempt ${attempt}: ${STATUS}"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelling" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --output json
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for SSM deploy command"
          exit 1

      - name: Confirm SSM command finished
        if: steps.wait.outcome == 'failure'
        run: |
          # Second wait budget for a command that outlived the first one. Only
          # a terminal Success may let the deploy proceed — anything else means
          # the box is in an unknown state and the health check below would
          # happily pass against the still-running previous version.
          COMMAND_ID="${{ steps.ssm.outputs.command_id }}"
          INSTANCE_ID="${{ steps.resolve.outputs.instance_id }}"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Confirm attempt ${attempt}: ${STATUS}"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelling" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --output json
              exit 1
            fi

            sleep 10
          done

          echo "SSM deploy command still not finished after 20 min total"
          exit 1

      - name: Health check
        id: health
        env:
          INSTANCE_ID: ${{ steps.resolve.outputs.instance_id }}
        run: |
          # First-boot pm2 backend intermittently hangs without binding port 3000.
          # `docker restart postra-app` clears it. Try for 3 min, restart, then wait
          # up to 10 min total before giving up.
          RESTART_DONE=0
          for attempt in $(seq 1 60); do
            STATUS=$(curl -s -o /tmp/postra-health.txt -w "%{http_code}" https://app-dev.postra.pl/api/monitor/queue/main || true)
            if [ "$STATUS" = "200" ]; then
              cat /tmp/postra-health.txt
              exit 0
            fi

            echo "Health check attempt ${attempt} failed with status: ${STATUS}"

            if [ "$attempt" = "18" ] && [ "$RESTART_DONE" = "0" ]; then
              echo "Backend still unhealthy after 3 min — triggering 'docker restart postra-app' to clear pm2 first-boot hang"
              RESTART_CMD=$(aws ssm send-command \
                --instance-ids "$INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --comment "Auto-recover pm2 first-boot hang" \
                --parameters "$(jq -nc '{commands: ["mkdir -p /var/lib/postra-watchdog && flock -w 90 /var/lib/postra-watchdog/lock sh -c '"'"'D=/var/lib/postra-watchdog; AGO=$(( $(date +%s) - $(cat $D/last-action 2>/dev/null || echo 0) )); if [ $AGO -lt 120 ]; then echo \"$(cat $D/last-action.by) restarted $AGO s ago - skip\"; else date +%s > $D/last-action; echo deploy-health > $D/last-action.by; docker restart postra-app; fi'"'"'"]}')" \
                --query "Command.CommandId" \
                --output text)
              echo "Restart SSM command: ${RESTART_CMD}"
              RESTART_DONE=1
              sleep 20
              continue
            fi

            sleep 10
          done

          echo "Health check failed after 10 min (including post-restart retries)"
          exit 1

      # One healthy answer does not mean the app has settled: on 2026-10-01
      # the smoke started seconds after the health check and one request got a
      # 502 from a backend still warming up, which rolled a good deploy back.
      # Wait for five healthy answers in a row (API and the page customers
      # open) before judging the deploy.
      - name: Wait for the app to settle
        run: |
          ok=0
          for attempt in $(seq 1 60); do
            API=$(curl -s -o /dev/null -w "%{http_code}" https://app.postra.pl/api/monitor/queue/main || true)
            WEB=$(curl -s -o /dev/null -w "%{http_code}" https://app.postra.pl/auth/login || true)
            if [ "$API" = "200" ] && [ "$WEB" = "200" ]; then
              ok=$((ok + 1))
              if [ "$ok" -ge 5 ]; then
                echo "Settled after $attempt checks"
                exit 0
              fi
            else
              echo "Check $attempt: api=$API web=$WEB — starting the count again"
              ok=0
            fi
            sleep 3
          done
          echo "::warning::The app did not answer 5 times in a row within 3 minutes — running the smoke anyway"

      # A healthy /api/monitor/queue/main does not mean a customer can use the
      # app. Sign in as the test account and walk calendar → composer → draft
      # saved → draft deleted (e2e/playwright). Drafts only — nothing publishes.
      # A failure rolls back like a failed health check. (Report-only until it
      # passed three deploys in a row: runs 36776530438, 36852451434,
      # 36893338653.)
      - name: Smoke test (Playwright)
        id: smoke
        env:
          E2E_BASE_URL: https://app.postra.pl
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_ORG: ${{ secrets.E2E_ORG }}
        run: |
          if [ -z "$E2E_EMAIL" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "::warning::E2E_EMAIL / E2E_PASSWORD not set — smoke test skipped"
            exit 0
          fi
          # Only the test runner, not the whole monorepo, at the version the
          # root devDependency pins (a hardcoded copy here drifted from it).
          npm install --prefix e2e/playwright --no-save --no-package-lock "@playwright/test@$(jq -r '.devDependencies["@playwright/test"]' package.json)"
          e2e/playwright/node_modules/.bin/playwright install --with-deps chromium
          # Chromium smoke only: WebKit and the landing run in the nightly
          # canary (e2e-canary.yml) — the landing ships separately and must
          # not roll back an app deploy.
          e2e/playwright/node_modules/.bin/playwright test -c e2e/playwright --project smoke

      # Screenshots only: traces are off in CI (they carry the session cookie).
      # failure() is needed: an `if` without a status function gets an implicit
      # success(), and after a failed smoke nothing is successful any more.
      - name: Upload smoke test screenshots
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke
          path: e2e/playwright/.results/
          retention-days: 7
          # The result folders start with a dot, which upload-artifact skips
          # unless told otherwise.
          include-hidden-files: true

      # The rollback recreates the container, and its logs go with it: after
      # the smoke failures of 2026-10-05 and 2026-10-06 nothing was left to
      # say why nginx answered 502. Save what the box saw first. This repo is
      # public, so only pm2's table, the backend's [boot] stages and nginx
      # error lines with the query string and headers cut off.
      - name: Save app errors before the rollback
        if: failure() && (steps.health.outcome == 'failure' || steps.smoke.outcome == 'failure')
        continue-on-error: true
        env:
          INSTANCE_ID: ${{ steps.resolve.outputs.instance_id }}
        run: |
          cat > /tmp/postra-diag.sh <<'EOF'
          echo "== pm2"
          docker exec postra-app pm2 ls --no-color | cut -c1-150
          echo "== backend boot stages"
          docker exec postra-app sh -c 'grep -h "^\[boot\]" /www/.pm2/logs/backend-out.log | tail -12'
          echo "== nginx errors, last 15 min"
          docker logs --since 15m postra-app 2>&1 \
            | grep -E '\[(error|crit|alert|emerg)\]' \
            | sed -E 's/, client: .*request: "([A-Z]+) ([^ ?"]*)[^"]*".*$/ \1 \2/' \
            | tail -40
          EOF
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Save app errors before rollback of ${GITHUB_SHA}" \
            --parameters "$(jq -nc --rawfile s /tmp/postra-diag.sh '{commands: [$s]}')" \
            --query "Command.CommandId" \
            --output text)
          for _ in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text 2>/dev/null || true)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 3
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text

      # A deploy that never turns healthy used to leave the broken image
      # running: the restart above is the only recovery the old workflow had
      # (E2E-01-08). Put the previous image back and say so. The job still
      # fails — the new version did not ship. ⚠️ Migrations the new image ran
      # on boot stay applied; the previous image has to cope with the newer
      # schema, which holds for additive migrations only.
      - name: Roll back to the previous image
        if: failure() && (steps.health.outcome == 'failure' || steps.smoke.outcome == 'failure')
        env:
          INSTANCE_ID: ${{ steps.resolve.outputs.instance_id }}
        run: |
          COMMANDS_JSON=$(jq -nc --arg region "${AWS_REGION}" --arg registry "${ECR_REGISTRY}" '{
            commands: [
              "set -e",
              "cd /opt/postra",
              "test -s .previous-image || { echo \"No previous image recorded\"; exit 1; }",
              "PREV=$(cat .previous-image)",
              "echo \"Rolling back to $PREV\"",
              "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
              "docker pull \"$PREV\"",
              "printf \"services:\\n  app:\\n    image: %s\\n\" \"$PREV\" > docker-compose.override.yml",
              "mkdir -p /var/lib/postra-watchdog && date +%s > /var/lib/postra-watchdog/last-action && echo rollback > /var/lib/postra-watchdog/last-action.by",
              "docker compose up -d --force-recreate app",
              "sleep 3 && docker exec -u root postra-app chown -R www:www /uploads || true"
            ]
          }')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Roll back ${GITHUB_SHA} on app-dev.postra.pl" \
            --parameters "${COMMANDS_JSON}" \
            --query "Command.CommandId" \
            --output text)

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)
            echo "Rollback attempt ${attempt}: ${STATUS}"
            [ "$STATUS" = "Success" ] && break
            if [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Failed" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --output json
              echo "Rollback command failed — the broken version is still running"
              exit 1
            fi
            sleep 10
          done

          for attempt in $(seq 1 30); do
            STATUS=$(curl -s -o /tmp/postra-health.txt -w "%{http_code}" https://app-dev.postra.pl/api/monitor/queue/main || true)
            if [ "$STATUS" = "200" ]; then
              echo "Rolled back: the previous version is healthy. This deploy did not ship."
              exit 1
            fi
            echo "Post-rollback health attempt ${attempt}: ${STATUS}"
            sleep 10
          done

          echo "Rolled back, but the previous version is not healthy either"
          exit 1
