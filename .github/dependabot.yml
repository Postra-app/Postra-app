# Latest stable of everything (decision 2026-10-06). Minors and patches come
# in a handful of groups. Majors are left to
# .github/workflows/dependency-freshness.yml, which keeps one issue listing
# them: checking ~100 majors one by one ran past the 55-minute limit every
# week (E2E-01-28), and each needs work of its own anyway. Security fixes
# come separately and are not affected (ignore applies to version updates
# only).
#
# One group for every minor and patch timed out on 2026-10-06: 72 packages
# behind, the job updated them one by one and GitHub cancelled it after 55
# minutes, so no PR came at all. Smaller groups each finish, and a group a
# reviewer can read is a group someone will merge.
#
# A group by dependency type beats a group by wildcard pattern: on 2026-10-07
# every @temporalio/*, @copilotkit/*, @langchain/*, @mastra/* and react-*
# package went to "production", and "ai" and "temporal" were left with the
# few exact names. So the type groups exclude every pattern of the named
# groups (repo/dependabot.spec.ts checks the lists stay in step).
#
# Packages we cannot take yet (TypeScript 5.9, CopilotKit 1.79, @atproto/api,
# polotno) are ignored here, each with its reason in the launch plan. They
# used to sit in a "held" group whose red PR came back every week (#371,
# #386); the weekly freshness issue lists them instead (#334). Every ignore
# names version-update types only, so security updates still come for them.
#
# Monthly, not weekly (K. 2026-10-17: too many bump PRs for no gain). Security
# updates are not version updates: they still come as soon as GitHub has them.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@copilotkit/react-core"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@copilotkit/react-textarea"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@copilotkit/react-ui"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@copilotkit/runtime"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@atproto/api"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "polotno"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # polotno pins mobx exactly; a newer mobx in the catalog puts a second
      # MobX under the design editor (#398, 19 X). mobx moves with polotno.
      - dependency-name: "mobx"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      ai:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["@ag-ui/*", "@langchain/*", "@mastra/*", "mastra", "openai", "@ai-sdk/*"]
      temporal:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["@temporalio/*", "nestjs-temporal-core"]
      react-next:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["react", "react-dom", "next", "@types/react", "@types/react-dom", "eslint-config-next", "swr", "react-*"]
      production:
        applies-to: version-updates
        dependency-type: "production"
        update-types: ["minor", "patch"]
        exclude-patterns: ["@ag-ui/*", "@langchain/*", "@mastra/*", "mastra", "openai", "@ai-sdk/*", "@temporalio/*", "nestjs-temporal-core", "react", "react-dom", "next", "@types/react", "@types/react-dom", "eslint-config-next", "swr", "react-*"]
      development:
        applies-to: version-updates
        dependency-type: "development"
        update-types: ["minor", "patch"]
        exclude-patterns: ["@ag-ui/*", "@langchain/*", "@mastra/*", "mastra", "openai", "@ai-sdk/*", "@temporalio/*", "nestjs-temporal-core", "react", "react-dom", "next", "@types/react", "@types/react-dom", "eslint-config-next", "swr", "react-*"]
  # The Node image of Dockerfile.dev. Its version has to equal volta.node in
  # package.json (ci-workflows.spec.ts). Node majors move by hand when they
  # reach LTS (Node 26: 2026-10-28), together with volta.node.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  # Global tools of the image. pnpm must equal packageManager
  # (ci-workflows.spec.ts), which Dependabot does not move, so pnpm is bumped
  # by hand in both places; the freshness issue says when it is behind. The
  # peers a relock used to move are pinned since 19 X (lockfile-peers.spec).
  - package-ecosystem: "npm"
    directory: "/var/docker/tools"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "pnpm"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # Images in the local compose files, in one PR. Temporal follows the
  # production box (infra issue #196) and docker-compose.yaml is upstream's
  # self-host file, so only minors and patches of the tools come here.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "temporalio/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      compose:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
