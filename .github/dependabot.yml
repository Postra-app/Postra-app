# Latest stable of everything (decision 2026-10-06). Patches and minors come
# grouped in one weekly PR; each major comes on its own, so it gets its own
# CI run and review. Security fixes come separately (Dependabot security
# updates are on).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
