# Latest stable of everything (decision 2026-10-06). Minors and patches come
# in a handful of groups. Majors are left to
# .github/workflows/dependency-freshness.yml, which keeps one issue listing
# them: checking ~100 majors one by one ran past the 55-minute limit every
# week (E2E-01-28), and each needs work of its own anyway. Security fixes
# come separately and are not affected (ignore applies to version updates
# only).
#
# One group for every minor and patch timed out on 2026-10-06: 72 packages
# behind, the job updated them one by one and GitHub cancelled it after 55
# minutes, so no PR came at all. Smaller groups each finish, and a group a
# reviewer can read is a group someone will merge.
#
# A group by dependency type beats a group by wildcard pattern: on 2026-10-07
# every @temporalio/*, @copilotkit/*, @langchain/*, @mastra/* and react-*
# package went to "production", and "ai" and "temporal" were left with the
# few exact names. So the type groups exclude every pattern of the named
# groups (repo/dependabot.spec.ts checks the lists stay in step).
#
# "held" collects minors we cannot take yet, each with its reason in the
# launch plan (TypeScript 5.9, CopilotKit 1.77, @atproto/api 0.23, polotno).
# Its PR stays red until the work is done, and it keeps the other groups green and mergeable meanwhile.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      held:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["typescript", "@copilotkit/react-core", "@copilotkit/react-textarea", "@copilotkit/react-ui", "@copilotkit/runtime", "@atproto/api", "polotno"]
      ai:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["@ag-ui/*", "@langchain/*", "@mastra/*", "mastra", "openai", "@ai-sdk/*"]
      temporal:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["@temporalio/*", "nestjs-temporal-core"]
      react-next:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["react", "react-dom", "next", "@types/react", "@types/react-dom", "eslint-config-next", "swr", "react-*"]
      production:
        applies-to: version-updates
        dependency-type: "production"
        update-types: ["minor", "patch"]
        exclude-patterns: ["typescript", "@copilotkit/react-core", "@copilotkit/react-textarea", "@copilotkit/react-ui", "@copilotkit/runtime", "@atproto/api", "polotno", "@ag-ui/*", "@langchain/*", "@mastra/*", "mastra", "openai", "@ai-sdk/*", "@temporalio/*", "nestjs-temporal-core", "react", "react-dom", "next", "@types/react", "@types/react-dom", "eslint-config-next", "swr", "react-*"]
      development:
        applies-to: version-updates
        dependency-type: "development"
        update-types: ["minor", "patch"]
        exclude-patterns: ["typescript", "@copilotkit/react-core", "@copilotkit/react-textarea", "@copilotkit/react-ui", "@copilotkit/runtime", "@atproto/api", "polotno", "@ag-ui/*", "@langchain/*", "@mastra/*", "mastra", "openai", "@ai-sdk/*", "@temporalio/*", "nestjs-temporal-core", "react", "react-dom", "next", "@types/react", "@types/react-dom", "eslint-config-next", "swr", "react-*"]
  # The Node image of Dockerfile.dev. Its version has to equal volta.node in
  # package.json (ci-workflows.spec.ts), so a PR from here is red until
  # volta.node moves with it: the reminder, and the place to do both.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
