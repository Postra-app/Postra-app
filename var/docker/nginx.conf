worker_processes                auto;
pid /tmp/nginx.pid;

events {
    worker_connections          1024;
}

http {
    include                     /etc/nginx/mime.types;
    default_type                application/octet-stream;
    sendfile                    on;
    access_log                  /var/log/nginx/access.log;
    client_max_body_size 50M;

    # Next.js answers a non-GET request for an asset that exists with a 500
    # rather than a 405 (a missing asset correctly 404s). Anyone can read the
    # real chunk URLs out of a page and replay them as POSTs, so that turns
    # into an unauthenticated way to mint 5xx on demand: two scans, on 04 and
    # 05 Aug, sent 28 harvested chunk URLs three times each and produced 168
    # 500s — every 5xx this box has served — tripping the ALB 5xx alarm.
    # Assets are read-only, so settle the method here and never proxy it.
    # GET/HEAD and /api/ are matched first and fall through untouched.
    map "$request_method:$uri" $asset_method_not_allowed {
        default                                                                    0;
        "~^(?:GET|HEAD):"                                                          0;
        "~^[A-Z]+:/api/"                                                           0;
        "~^[A-Z]+:/_next/static/"                                                  1;
        "~^[A-Z]+:.*\.(?:ico|svg|png|jpe?g|gif|webp|avif|js|css|map|woff2?|ttf|eot)$"  1;
    }

    server {
        listen 5000;
        server_name _;

        if ($asset_method_not_allowed) {
            return 405;
        }

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Studio renders video in the browser and POSTs the finished MP4 here.
        # The editor accepts clips up to 200 MB (MAX_LIBRARY_VIDEO_BYTES) and a
        # re-encoded few minutes of 1080p comfortably passes 50 MB, so the
        # global cap above turned every longer clip into an opaque 413 and the
        # backend's own per-type limits (custom.upload.validation.ts) never got
        # a say. Raise it for this one endpoint, and stream the body through
        # instead of spooling a quarter-gigabyte onto this box's disk.
        location = /api/media/upload-simple {
            client_max_body_size 220M;
            proxy_request_buffering off;
            proxy_pass http://localhost:3000/media/upload-simple;
            # nginx sets these four for every response (server block above);
            # the backend's helmet sets its own, so /api answered each twice,
            # X-Frame-Options and Referrer-Policy with conflicting values
            # (E2E-02-12). One source: nginx.
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Strict-Transport-Security;
            proxy_http_version 1.1;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
        }

        location /api/ {
            proxy_pass http://localhost:3000/;
            # nginx sets these four for every response (server block above);
            # the backend's helmet sets its own, so /api answered each twice,
            # X-Frame-Options and Referrer-Policy with conflicting values
            # (E2E-02-12). One source: nginx.
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Strict-Transport-Security;
            proxy_http_version 1.1;
            # AI generation (design spec + gpt-image-2 + S3 upload) legitimately
            # runs past nginx's 60s default. The OpenAI client allows 90s per
            # call; 180s covers spec + image + upload with headroom. Must be
            # raised together with the ALB idle_timeout (terraform) — the
            # gateway chain times out at its LOWEST link.
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
        }

        location /uploads/ {
            alias /uploads/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'none'; script-src 'none'; frame-ancestors 'none'; sandbox" always;
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/gif gif;
                image/webp webp;
                image/avif avif;
                image/bmp bmp;
                image/tiff tif tiff;
                video/mp4 mp4;
            }
            default_type application/octet-stream;
        }

        location / {
            proxy_pass http://localhost:4200/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header i18next $http_i18next;
        }
    }
}