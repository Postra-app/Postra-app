worker_processes                auto;
pid /tmp/nginx.pid;

events {
    worker_connections          1024;
}

http {
    include                     /etc/nginx/mime.types;
    default_type                application/octet-stream;
    sendfile                    on;
    access_log                  /var/log/nginx/access.log;
    client_max_body_size 50M;

    # Next.js answers a non-GET request for an asset that exists with a 500
    # rather than a 405 (a missing asset correctly 404s). Anyone can read the
    # real chunk URLs out of a page and replay them as POSTs, so that turns
    # into an unauthenticated way to mint 5xx on demand: two scans, on 04 and
    # 05 Aug, sent 28 harvested chunk URLs three times each and produced 168
    # 500s — every 5xx this box has served — tripping the ALB 5xx alarm.
    # Assets are read-only, so settle the method here and never proxy it.
    # GET/HEAD and /api/ are matched first and fall through untouched.
    map "$request_method:$uri" $asset_method_not_allowed {
        default                                                                    0;
        "~^(?:GET|HEAD):"                                                          0;
        "~^[A-Z]+:/api/"                                                           0;
        "~^[A-Z]+:/_next/static/"                                                  1;
        "~^[A-Z]+:.*\.(?:ico|svg|png|jpe?g|gif|webp|avif|js|css|map|woff2?|ttf|eot)$"  1;
    }

    # Upstreams are 127.0.0.1, never "localhost". In the container localhost
    # resolves to 127.0.0.1 and ::1, so nginx treats each proxy_pass as a
    # group of two servers and takes each out for 10 s after one failed
    # connect (max_fails=1, fail_timeout=10s). While the backend boots both
    # get marked down, and nginx keeps answering "no live upstreams" 502s for
    # up to 10 s after the backend is already listening; one later hiccup
    # does the same mid-traffic. Deploy smoke tests failed this way on
    # 2026-10-05 and 2026-10-06 and rolled good deploys back. A single
    # address is never marked down. backend and frontend listen on both
    # stacks, so nothing else changes.
    server {
        listen 5000;
        server_name _;

        if ($asset_method_not_allowed) {
            return 405;
        }

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Content-Security-Policy, report-only first: browsers report what it
        # would block to /api/public/csp-report (backend log, "[csp]"), and the
        # policy is enforced once a week of reports shows nothing legitimate
        # in it. Inline scripts stay allowed until Next.js renders with a
        # nonce; eval is left out on purpose, to learn whether anything uses
        # it. Images, media and API calls go to many platform CDNs and to
        # S3 directly (uploads), hence https: there.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/public/csp-report" always;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Studio renders video in the browser and POSTs the finished MP4 here.
        # The editor accepts clips up to 200 MB (MAX_LIBRARY_VIDEO_BYTES) and a
        # re-encoded few minutes of 1080p comfortably passes 50 MB, so the
        # global cap above turned every longer clip into an opaque 413 and the
        # backend's own per-type limits (custom.upload.validation.ts) never got
        # a say. Raise it for this one endpoint, and stream the body through
        # instead of spooling a quarter-gigabyte onto this box's disk.
        location = /api/media/upload-simple {
            client_max_body_size 220M;
            proxy_request_buffering off;
            proxy_pass http://127.0.0.1:3000/media/upload-simple;
            # nginx sets these four for every response (server block above);
            # the backend's helmet sets its own, so /api answered each twice,
            # X-Frame-Options and Referrer-Policy with conflicting values
            # (E2E-02-12). One source: nginx.
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Strict-Transport-Security;
            proxy_http_version 1.1;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Pass the ALB's X-Forwarded-For through unchanged. Its last entry is the
            # client address the ALB saw; $proxy_add_x_forwarded_for would append
            # the ALB node's own private IP, and every anonymous user behind that
            # node would share one auth throttle bucket (E2E-02-39).
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
        }

        # OAuth discovery for MCP clients, at the origin where RFC 9728 and
        # RFC 8414 put it: the 401 from /api/mcp-oauth points here, and with
        # the issuer https://<host>/api a client looks for
        # /.well-known/oauth-authorization-server/api. Both were the
        # frontend's 404, so no MCP client could sign in (E2E-08-45). The
        # backend answers these paths under any suffix.
        location ^~ /.well-known/oauth-protected-resource {
            proxy_pass http://127.0.0.1:3000/.well-known/oauth-protected-resource;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Strict-Transport-Security;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /.well-known/oauth-authorization-server {
            proxy_pass http://127.0.0.1:3000/.well-known/oauth-authorization-server;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Strict-Transport-Security;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:3000/;
            # nginx sets these four for every response (server block above);
            # the backend's helmet sets its own, so /api answered each twice,
            # X-Frame-Options and Referrer-Policy with conflicting values
            # (E2E-02-12). One source: nginx.
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Strict-Transport-Security;
            proxy_http_version 1.1;
            # AI generation (design spec + gpt-image-2 + S3 upload) legitimately
            # runs past nginx's 60s default. The OpenAI client allows 90s per
            # call; 180s covers spec + image + upload with headroom. Must be
            # raised together with the ALB idle_timeout (terraform) — the
            # gateway chain times out at its LOWEST link.
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
        }

        location /uploads/ {
            alias /uploads/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'none'; script-src 'none'; frame-ancestors 'none'; sandbox" always;
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/gif gif;
                image/webp webp;
                image/avif avif;
                image/bmp bmp;
                image/tiff tif tiff;
                video/mp4 mp4;
            }
            default_type application/octet-stream;
        }

        location / {
            proxy_pass http://127.0.0.1:4200/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header i18next $http_i18next;
        }
    }
}